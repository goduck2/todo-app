<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store 테스트</title>
  <style>
    body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; margin: 16px; line-height: 1.5; }
    #summary { font-size: 1.2rem; font-weight: 700; }
    #summary.pass { color: #14602a; }
    #summary.fail { color: #c62828; }
    ul { list-style: none; padding: 0; }
    li { padding: 4px 0; }
    .pass-mark { color: #14602a; font-weight: 700; }
    .fail-mark { color: #c62828; font-weight: 700; }
    .msg { color: #c62828; margin-left: 1.5em; font-size: 0.9rem; white-space: pre-wrap; }
  </style>
  <!-- 화면 요소(#todo-list)가 없으므로 app.js는 Store만 정의한다 -->
  <script src="app.js"></script>
</head>
<body>
  <h1>Store 테스트</h1>
  <p id="summary">실행 중…</p>
  <ul id="results"></ul>

  <script>
    var TEST_KEY = 'todo-app-test-v1';          // 실제 키("todo-app-v1")와 분리
    var CORRUPT_KEY = TEST_KEY + '-corrupt';
    var BEFORE_KEY = TEST_KEY + '-before-import';
    var REAL_KEY = 'todo-app-v1';
    var realBefore = localStorage.getItem(REAL_KEY);
    var realBeforeImport = localStorage.getItem(REAL_KEY + '-before-import');

    var results = [];
    function test(name, fn) {
      try { reset(); fn(); results.push({ name: name, ok: true }); }
      catch (e) { results.push({ name: name, ok: false, msg: e.message }); }
    }
    function ok(cond, msg) { if (!cond) throw new Error(msg || '조건 불일치'); }
    function eq(actual, expected, msg) {
      if (JSON.stringify(actual) !== JSON.stringify(expected)) {
        throw new Error((msg ? msg + ': ' : '') + '기대 ' + JSON.stringify(expected) + ' / 실제 ' + JSON.stringify(actual));
      }
    }
    function reset() {
      Store.configure({ key: TEST_KEY, clock: null });
      localStorage.removeItem(TEST_KEY);
      localStorage.removeItem(CORRUPT_KEY);
      localStorage.removeItem(BEFORE_KEY);
      Store.load();
    }
    // 로컬 시간 기준 ms
    function L(y, m, d, h, mi, s, ms) { return new Date(y, m - 1, d, h || 0, mi || 0, s || 0, ms || 0).getTime(); }
    function setNow(ms) { Store.configure({ clock: function () { return ms; } }); }
    // 저장소를 직접 써서 상태를 만든 뒤 새로 load
    function seed(obj) { localStorage.setItem(TEST_KEY, JSON.stringify(obj)); Store.load(); }
    function todo(id, o) {
      return { id: id, title: o.title || id, category: o.category || 'work', done: !!o.done,
        createdAt: o.createdAt, doneAt: o.doneAt === undefined ? null : o.doneAt, updatedAt: o.createdAt };
    }
    var DAY = 24 * 60 * 60 * 1000;

    /* ---- 추가 ---- */
    test('add: 앞뒤 공백 제거, 필드 구성, lastCategory 갱신', function () {
      setNow(1000);
      var t = Store.add('  우유 사기  ', 'personal');
      ok(t, 'add가 null');
      eq(t.title, '우유 사기');
      eq([t.category, t.done, t.doneAt, t.createdAt, t.updatedAt], ['personal', false, null, 1000, 1000]);
      ok(typeof t.id === 'string' && t.id.length > 0, 'id 없음');
      eq(Store.getSettings().lastCategory, 'personal');
    });
    test('add: 빈 제목·공백만 거부', function () {
      eq(Store.add('', 'work'), null);
      eq(Store.add('   ', 'work'), null);
      eq(Store.add(null, 'work'), null);
      eq(Store.todayList().length, 0);
    });
    test('add: 101자 거부, 100자 허용', function () {
      eq(Store.add(new Array(102).join('가'), 'work'), null, '101자');
      ok(Store.add(new Array(101).join('가'), 'work'), '100자는 허용');
      eq(Store.todayList().length, 1);
    });
    test('add: 잘못된 카테고리 거부, 거부 시 lastCategory 불변', function () {
      eq(Store.add('x', 'play'), null);
      eq(Store.add('x'), null);
      eq(Store.getSettings().lastCategory, 'work');
    });

    /* ---- 수정 ---- */
    test('update: 제목·카테고리 변경, updatedAt 갱신', function () {
      setNow(1000); var t = Store.add('a', 'work');
      setNow(2000); var u = Store.update(t.id, { title: ' b ', category: 'study' });
      eq([u.title, u.category, u.updatedAt, u.createdAt], ['b', 'study', 2000, 1000]);
    });
    test('update: 잘못된 값이면 아무것도 바꾸지 않음', function () {
      var t = Store.add('a', 'work');
      eq(Store.update(t.id, { title: '   ' }), null, '빈 제목');
      eq(Store.update(t.id, { title: new Array(102).join('x') }), null, '101자');
      eq(Store.update(t.id, { title: 'ok', category: 'nope' }), null, '잘못된 카테고리');
      eq(Store.update('없는-id', { title: 'z' }), null, '없는 id');
      var cur = Store.todayList()[0];
      eq([cur.title, cur.category], ['a', 'work']);
    });

    /* ---- 삭제·복원 ---- */
    test('remove + restore: 원래 자리로 복원', function () {
      setNow(1000); var a = Store.add('a', 'work');
      setNow(2000); var b = Store.add('b', 'work');
      setNow(3000); var c = Store.add('c', 'work');
      var removed = Store.remove(b.id);
      eq(removed.id, b.id);
      eq(Store.todayList().map(function (x) { return x.title; }), ['a', 'c']);
      ok(Store.restore(removed), 'restore 실패');
      eq(Store.todayList().map(function (x) { return x.title; }), ['a', 'b', 'c']);
    });
    test('remove: 없는 id는 null, restore: 중복·잘못된 항목 거부', function () {
      var a = Store.add('a', 'work');
      eq(Store.remove('없음'), null);
      eq(Store.restore(a), false, '이미 존재');
      eq(Store.restore({ id: 'x', title: '' }), false, '잘못된 항목');
    });
    test('remove한 완료 항목도 restore하면 완료 상태 유지', function () {
      setNow(1000); var a = Store.add('a', 'work');
      setNow(2000); Store.toggle(a.id);
      var r = Store.remove(a.id);
      Store.restore(r);
      var cur = Store.todayList()[0];
      eq([cur.done, cur.doneAt], [true, 2000]);
    });

    /* ---- 완료 토글 ---- */
    test('toggle 왕복: done/doneAt/updatedAt', function () {
      setNow(1000); var t = Store.add('a', 'work');
      setNow(5000); var d = Store.toggle(t.id);
      eq([d.done, d.doneAt, d.updatedAt], [true, 5000, 5000]);
      setNow(9000); var u = Store.toggle(t.id);
      eq([u.done, u.doneAt, u.updatedAt], [false, null, 9000]);
      eq(Store.toggle('없음'), null);
    });

    /* ---- 저장·불러오기 ---- */
    test('새로 load해도 데이터 유지', function () {
      setNow(1000); var a = Store.add('a', 'study');
      setNow(2000); Store.add('b', 'personal');
      setNow(3000); Store.toggle(a.id);
      var before = Store.todayList();
      var settingsBefore = Store.getSettings();
      Store.configure({ key: TEST_KEY });   // 메모리 상태 폐기
      ok(Store.load() === true, 'load가 정상 아님');
      eq(Store.todayList(), before);
      eq(Store.getSettings(), settingsBefore);
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).version, 1);
    });
    test('깨진 JSON: 기본값으로 시작, 원본은 corrupt 키에 보관', function () {
      localStorage.setItem(TEST_KEY, '{broken json');
      eq(Store.load(), false, '복구 표시');
      eq(Store.todayList().length, 0);
      eq(localStorage.getItem(CORRUPT_KEY), '{broken json');
      ok(Store.add('복구 후 추가', 'work'), '복구 후 add 실패');
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).todos.length, 1);
      eq(localStorage.getItem(CORRUPT_KEY), '{broken json', '원본 유지');
    });
    test('형식이 틀린 JSON(배열 등)도 복구', function () {
      localStorage.setItem(TEST_KEY, '[1,2,3]');
      eq(Store.load(), false);
      eq(localStorage.getItem(CORRUPT_KEY), '[1,2,3]');
      eq(Store.todayList().length, 0);
    });
    test('일부 항목만 깨진 경우: 정상 항목은 살리고 원본 보관', function () {
      var good = todo('g', { createdAt: 1000 });
      var raw = JSON.stringify({ version: 1, todos: [good, { id: 'bad', title: '', category: 'work', createdAt: 1 }], settings: {} });
      localStorage.setItem(TEST_KEY, raw);
      eq(Store.load(), false);
      eq(Store.todayList().map(function (x) { return x.id; }), ['g']);
      eq(localStorage.getItem(CORRUPT_KEY), raw);
    });
    test('version 없음: migrate 후 version 1로 유지', function () {
      localStorage.setItem(TEST_KEY, JSON.stringify({ todos: [todo('a', { createdAt: 1000 })] }));
      eq(Store.load(), true);
      eq(Store.todayList().length, 1);
      Store.save();
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).version, 1);
    });
    test('미래 version: 데이터 덮어쓰기 전에 corrupt 키로 보관', function () {
      var raw = JSON.stringify({ version: 2, todos: [todo('a', { createdAt: 1000 })], settings: {} });
      localStorage.setItem(TEST_KEY, raw);
      eq(Store.load(), false);
      eq(localStorage.getItem(CORRUPT_KEY), raw);
      eq(Store.todayList().length, 0);
    });
    test('저장 실패 시 예외 없이 false, 메모리 상태는 유지', function () {
      var orig = Storage.prototype.setItem;
      Storage.prototype.setItem = function () { throw new Error('QuotaExceeded'); };
      try {
        var t = Store.add('a', 'work');
        ok(t, '저장 실패여도 add는 메모리에 반영');
        eq(Store.save(), false, 'save 반환값');
        eq(Store.saveOk(), false, 'saveOk');
        eq(Store.todayList().length, 1);
      } finally { Storage.prototype.setItem = orig; }
      eq(Store.save(), true, '복구 후 save');
      eq(Store.saveOk(), true);
    });

    /* ---- 오래된 완료 항목 정리 ---- */
    test('purgeOld: 8일 전 완료 삭제, 6일 전 완료·미완료는 유지', function () {
      var now = L(2026, 11, 22, 12);
      setNow(now);
      seed({ version: 1, settings: {}, todos: [
        todo('old8', { createdAt: now - 20 * DAY, done: true, doneAt: now - 8 * DAY }),
        todo('keep6', { createdAt: now - 20 * DAY, done: true, doneAt: now - 6 * DAY }),
        todo('open', { createdAt: now - 30 * DAY })
      ] });
      // load가 이미 한 번 정리했으므로 저장소 내용으로 확인
      var ids = JSON.parse(localStorage.getItem(TEST_KEY)).todos.map(function (x) { return x.id; });
      eq(ids.sort(), ['keep6', 'open']);   // old8만 삭제됨 (저장 순서는 생성순)
    });
    test('purgeOld(now): 삭제 개수 반환, 7일 경계, 저장 반영', function () {
      var now = L(2026, 11, 22, 12);
      setNow(now);
      seed({ version: 1, settings: {}, todos: [
        todo('a', { createdAt: 1, done: true, doneAt: now - 7 * DAY + 1 }),   // 7일이 되기 1ms 전
        todo('b', { createdAt: 2, done: true, doneAt: now - 7 * DAY })        // 정확히 7일
      ] });
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).todos.map(function (x) { return x.id; }), ['a'], 'load 후');
      eq(Store.purgeOld(now), 0);
      eq(Store.purgeOld(now + 1), 1, '1ms 뒤 7일 경과');
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).todos.length, 0, '저장 반영');
    });

    /* ---- 날짜 ---- */
    test('dateKey: 자정 전후', function () {
      eq(Store.dateKey(L(2026, 11, 22, 23, 59, 59, 999)), '2026-11-22');
      eq(Store.dateKey(L(2026, 11, 23, 0, 0, 0, 0)), '2026-11-23');
    });
    test('dateKey: 월·연 경계와 0 채우기', function () {
      eq(Store.dateKey(L(2026, 12, 31, 23, 59, 59, 999)), '2026-12-31');
      eq(Store.dateKey(L(2027, 1, 1, 0, 0, 0, 0)), '2027-01-01');
      eq(Store.dateKey(L(2026, 1, 5, 9)), '2026-01-05');
    });
    test('dateKey: 오전 일찍(UTC와 날짜가 어긋나는 시간대)도 로컬 날짜', function () {
      [0, 1, 8, 9, 15, 23].forEach(function (h) {
        eq(Store.dateKey(new Date(2026, 10, 22, h, 30)), '2026-11-22', h + '시 30분');
      });
    });
    test('dateKey: Date 객체와 ms 모두 허용, 인자 없으면 현재 시각', function () {
      var ms = L(2026, 3, 9, 10);
      eq(Store.dateKey(new Date(ms)), Store.dateKey(ms));
      setNow(L(2026, 7, 4, 12));
      eq(Store.dateKey(), '2026-07-04');
    });

    /* ---- 오늘 할 일 ---- */
    test('todayList: 미완료 전체 + 오늘 완료, 어제 완료는 제외', function () {
      var now = L(2026, 11, 22, 15);
      setNow(now);
      seed({ version: 1, settings: {}, todos: [
        todo('yDone', { createdAt: 1, done: true, doneAt: L(2026, 11, 21, 23, 59, 59, 999) }),
        todo('tDone0', { createdAt: 2, done: true, doneAt: L(2026, 11, 22, 0, 0, 0, 0) }),
        todo('oldOpen', { createdAt: 3 })
      ] });
      eq(Store.todayList().map(function (x) { return x.id; }), ['oldOpen', 'tDone0']);
    });
    test('todayList: 미완료는 생성순, 완료는 아래로', function () {
      var now = L(2026, 11, 22, 15);
      seed({ version: 1, settings: {}, todos: [
        todo('d1', { createdAt: 100, done: true, doneAt: now - 1000 }),
        todo('o2', { createdAt: 300 }),
        todo('o1', { createdAt: 200 })
      ] });
      setNow(now);
      eq(Store.todayList().map(function (x) { return x.id; }), ['o1', 'o2', 'd1']);
    });
    test('todayList: 자정이 지나면 어제 완료한 항목이 사라짐', function () {
      setNow(L(2026, 11, 22, 23, 59, 0)); var t = Store.add('a', 'work'); Store.toggle(t.id);
      eq(Store.todayList().length, 1);
      setNow(L(2026, 11, 23, 0, 1, 0));
      eq(Store.todayList().length, 0);
    });

    /* ---- 진행률 ---- */
    test('progress: total 0이면 percent 0', function () {
      eq(Store.progress(), { done: 0, total: 0, percent: 0 });
      eq(Store.progress('work'), { done: 0, total: 0, percent: 0 });
    });
    test('progress: 전체·카테고리별·반올림', function () {
      var a = Store.add('a', 'work'), b = Store.add('b', 'work'), c = Store.add('c', 'study');
      Store.toggle(a.id);
      eq(Store.progress(), { done: 1, total: 3, percent: 33 });
      eq(Store.progress('work'), { done: 1, total: 2, percent: 50 });
      eq(Store.progress('study'), { done: 0, total: 1, percent: 0 });
      eq(Store.progress('personal'), { done: 0, total: 0, percent: 0 });
      eq(Store.progress('all'), { done: 1, total: 3, percent: 33 }, '알 수 없는 값은 전체');
      Store.toggle(b.id); Store.toggle(c.id);
      eq(Store.progress().percent, 100);
    });

    /* ---- id ---- */
    test('newId: 비어 있지 않고 중복 없음', function () {
      var seen = {}, i, id;
      for (i = 0; i < 2000; i++) {
        id = Store.newId();
        ok(typeof id === 'string' && id.length > 0, 'id 형식');
        ok(!seen[id], '중복 id');
        seen[id] = 1;
      }
    });

    /* ---- 선택한 탭(activeTab) ---- */
    test('activeTab: 기본값 all, 저장 후 새로 load해도 유지', function () {
      eq(Store.getSettings().activeTab, 'all');
      eq(Store.setActiveTab('study'), true);
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).settings.activeTab, 'study', '저장됨');
      Store.configure({ key: TEST_KEY });
      Store.load();
      eq(Store.getSettings().activeTab, 'study');
    });
    test('activeTab: 잘못된 값은 거부하고 기존 값 유지', function () {
      Store.setActiveTab('work');
      eq(Store.setActiveTab('nope'), false);
      eq(Store.setActiveTab(undefined), false);
      eq(Store.getSettings().activeTab, 'work');
    });
    test('activeTab: 필드가 없는 예전 데이터·깨진 값은 all', function () {
      seed({ version: 1, todos: [], settings: { lastCategory: 'study' } });
      eq(Store.getSettings().activeTab, 'all', '필드 없음');
      eq(Store.getSettings().lastCategory, 'study', '다른 설정 유지');
      seed({ version: 1, todos: [], settings: { activeTab: 'zzz' } });
      eq(Store.getSettings().activeTab, 'all', '깨진 값');
    });
    test('activeTab: 탭을 바꿔도 할 일 데이터는 그대로', function () {
      Store.add('a', 'work');
      var before = Store.todayList();
      Store.setActiveTab('personal');
      eq(Store.todayList(), before);
    });

    /* ---- 탭별 미완료 개수 ---- */
    test('openCounts: 미완료만 센다(완료 제외), 전체 = 합계', function () {
      eq(Store.openCounts(), { all: 0, work: 0, personal: 0, study: 0 }, '비어 있을 때');
      var a = Store.add('a', 'work'), b = Store.add('b', 'work');
      Store.add('c', 'personal');
      var d = Store.add('d', 'study');
      eq(Store.openCounts(), { all: 4, work: 2, personal: 1, study: 1 });
      Store.toggle(a.id); Store.toggle(d.id);
      eq(Store.openCounts(), { all: 2, work: 1, personal: 1, study: 0 }, '완료 후');
      Store.toggle(a.id);
      eq(Store.openCounts().work, 2, '완료 해제 후');
      Store.remove(b.id);
      eq(Store.openCounts(), { all: 2, work: 1, personal: 1, study: 0 }, '삭제 후');
    });

    /* ---- progress(category) 추가 검증 ---- */
    test('progress(category): 카테고리별 분모·분자가 서로 섞이지 않음', function () {
      var w1 = Store.add('w1', 'work'), w2 = Store.add('w2', 'work'), w3 = Store.add('w3', 'work');
      var p1 = Store.add('p1', 'personal');
      Store.toggle(w1.id); Store.toggle(w2.id); Store.toggle(p1.id);
      eq(Store.progress('work'), { done: 2, total: 3, percent: 67 });
      eq(Store.progress('personal'), { done: 1, total: 1, percent: 100 });
      eq(Store.progress('study'), { done: 0, total: 0, percent: 0 });
      eq(Store.progress(), { done: 3, total: 4, percent: 75 });
    });
    test('progress: 퍼센트는 반올림 정수 (1/8=13, 1/6=17, 5/6=83)', function () {
      var ids = [];
      for (var i = 0; i < 8; i++) ids.push(Store.add('t' + i, 'work').id);
      Store.toggle(ids[0]);
      eq(Store.progress().percent, 13, '1/8=12.5→13');
      reset();
      ids = [];
      for (i = 0; i < 6; i++) ids.push(Store.add('t' + i, 'work').id);
      Store.toggle(ids[0]);
      eq(Store.progress().percent, 17, '1/6');
      for (i = 1; i < 5; i++) Store.toggle(ids[i]);
      eq(Store.progress().percent, 83, '5/6');
      ok(Number.isInteger(Store.progress().percent), '정수');
    });
    test('progress: 100%는 전부 완료했을 때만', function () {
      var a = Store.add('a', 'work'), b = Store.add('b', 'work');
      Store.toggle(a.id);
      ok(Store.progress().percent < 100, '절반');
      Store.toggle(b.id);
      eq(Store.progress(), { done: 2, total: 2, percent: 100 });
    });
    test('progress: 어제 완료한 항목은 분자·분모에서 빠짐', function () {
      var now = L(2026, 11, 22, 10);
      seed({ version: 1, settings: {}, todos: [
        todo('yDone', { createdAt: 1, category: 'work', done: true, doneAt: L(2026, 11, 21, 18) }),
        todo('tDone', { createdAt: 2, category: 'work', done: true, doneAt: L(2026, 11, 22, 9) }),
        todo('open', { createdAt: 3, category: 'work' })
      ] });
      eq(Store.progress('work', now), { done: 1, total: 2, percent: 50 });
      eq(Store.progress(undefined, now), { done: 1, total: 2, percent: 50 });
    });
    test('progress: 자정을 넘기면 오늘 완료 항목이 빠져 total이 줄어듦', function () {
      var t = L(2026, 11, 22, 23, 50);
      Store.configure({ clock: function () { return t; } });
      Store.load();
      var a = Store.add('a', 'work'), b = Store.add('b', 'work');
      Store.toggle(a.id);
      eq(Store.progress('work'), { done: 1, total: 2, percent: 50 }, '자정 전');
      t = L(2026, 11, 23, 0, 10);
      eq(Store.progress('work'), { done: 0, total: 1, percent: 0 }, '자정 후');

    function goodTodo(o) {
      var t = { id: 'a', title: '할 일', category: 'work', done: false, createdAt: 1000, doneAt: null, updatedAt: 1000 };

      var b = { version: 1, todos: todos, settings: { reminderTime: '09:30', lastCategory: 'study', lastAckDate: null, lastNotifiedDate: null, activeTab: 'personal' } };
      for (var k in extra) b[k] = extra[k];

      var r = Store.validateBackup(obj);
      eq(r.ok, false, '거부되어야 함');
      ok(typeof r.error === 'string' && r.error.length > 0 && r.error.indexOf('\n') === -1, '한 줄 메시지');
      if (contains) ok(r.error.indexOf(contains) !== -1, '메시지에 "' + contains + '" 포함: ' + r.error);
    }

    test('importBackup: 교체 전 현재 데이터를 before-import 키에 보관', function () {
      setNow(L(2026, 11, 22, 10));
      Store.add('기존 1', 'work'); Store.add('기존 2', 'work');
      var before = JSON.parse(localStorage.getItem(TEST_KEY));
      eq(localStorage.getItem(BEFORE_KEY), null, '가져오기 전에는 없음');
      var r = Store.importBackup(backup([goodTodo({ id: 'n1', title: '새것' })]));
      eq(r.ok, true);
      eq(JSON.parse(localStorage.getItem(BEFORE_KEY)), before, '이전 데이터 그대로 보관');
      eq(Store.todayList().map(function (t) { return t.title; }), ['새것'], '교체됨');
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).todos.length, 1, '저장소도 교체');
    });
    test('importBackup: 검증 실패 시 기존 데이터 그대로, before-import 키도 만들지 않음', function () {
      Store.add('지켜야 할 데이터', 'work');
      var before = localStorage.getItem(TEST_KEY);
      var r = Store.importBackup(backup([goodTodo({ category: 'play' })]));
      eq(r.ok, false);
      ok(r.error.indexOf('category') !== -1, r.error);
      eq(localStorage.getItem(TEST_KEY), before, '저장소 불변');
      eq(Store.todayList().length, 1, '메모리 불변');
      eq(localStorage.getItem(BEFORE_KEY), null, 'before-import 없음');
      eq(Store.importBackup(null).ok, false);
      eq(Store.importBackup({ version: 1 }).ok, false);
    });
    test('importBackup: 저장소 쓰기가 실패하면 취소하고 기존 데이터 유지', function () {
      Store.add('기존', 'work');
      var orig = Storage.prototype.setItem, snap = Store.todayList();
      Storage.prototype.setItem = function () { throw new Error('QuotaExceeded'); };
      var r;
      try { r = Store.importBackup(backup([goodTodo({ id: 'z', title: '새것' })])); }
      finally { Storage.prototype.setItem = orig; }
      eq(r.ok, false);
      eq(Store.todayList(), snap, '메모리 불변');
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).todos.length, 1, '저장소 불변');
    });
    test('importBackup: 가져온 뒤 purgeOld 적용(8일 전 완료 삭제, 6일 전 유지)', function () {
      var now = L(2026, 11, 22, 12);
      setNow(now);
      var r = Store.importBackup(backup([
        goodTodo({ id: 'old8', done: true, doneAt: now - 8 * DAY, createdAt: 1 }),
        goodTodo({ id: 'keep6', done: true, doneAt: now - 6 * DAY, createdAt: 2 }),
        goodTodo({ id: 'open', createdAt: 3 })]));
      eq(r.ok, true); eq(r.total, 2); eq(r.purged, 1);
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).todos.map(function (t) { return t.id; }).sort(), ['keep6', 'open']);
    });
    test('importBackup: settings가 없는 백업은 현재 설정 유지, 있으면 교체', function () {
      Store.setReminderTime('07:30'); Store.setActiveTab('work');
      Store.importBackup({ version: 1, todos: [goodTodo({})] });
      eq([Store.getSettings().reminderTime, Store.getSettings().activeTab], ['07:30', 'work'], 'settings 없음 → 유지');
      Store.importBackup(backup([goodTodo({})]));
      eq([Store.getSettings().reminderTime, Store.getSettings().activeTab, Store.getSettings().lastCategory], ['09:30', 'personal', 'study'], 'settings 있음 → 교체');
    });
    test('importBackup: 빈 백업(할 일 0개)도 가능, 새로 load해도 유지', function () {
      Store.add('a', 'work');
      eq(Store.importBackup({ version: 1, todos: [] }).ok, true);
      Store.configure({ key: TEST_KEY }); Store.load();
      eq(Store.todoCount(), 0);
    });
    test('importBackup: 제목의 앞뒤 공백은 정리되어 저장', function () {
      Store.importBackup(backup([goodTodo({ title: '  공백 제거  ' })]));
      eq(Store.todayList()[0].title, '공백 제거');
    });
    test('backupFileName: todo-backup-YYYY-MM-DD.json (로컬 날짜)', function () {
      eq(Store.backupFileName(L(2026, 11, 22, 0, 30)), 'todo-backup-2026-11-22.json');
      eq(Store.backupFileName(L(2026, 1, 5, 23, 59)), 'todo-backup-2026-01-05.json');
      setNow(L(2027, 3, 9, 8));
      eq(Store.backupFileName(), 'todo-backup-2027-03-09.json', '인자 없으면 현재');
    });

    /* ---- 저장소 읽기 실패 ---- */
    test('getItem이 예외를 던지면: 기존 저장 데이터를 덮어쓰지 않고 save는 false', function () {
      var orig = JSON.stringify({ version: 1, settings: {}, todos: [goodTodo({ id: 'keep', title: '지켜야 함' })] });
      localStorage.setItem(TEST_KEY, orig);
      var realGet = Storage.prototype.getItem;
      Storage.prototype.getItem = function () { throw new Error('denied'); };
      try {
        Store.configure({ key: TEST_KEY });
        Store.load();
        var t = Store.add('새 항목', 'work');
        ok(t, '메모리에는 추가됨');
        eq(Store.save(), false, 'save 반환값');
        eq(Store.saveOk(), false, 'saveOk');
        Store.toggle(t.id); Store.remove(t.id);
      } finally { Storage.prototype.getItem = realGet; }
      eq(localStorage.getItem(TEST_KEY), orig, '저장소는 그대로');
      Store.configure({ key: TEST_KEY });
      Store.load();
      eq(Store.todayList().map(function (x) { return x.id; }), ['keep'], '다시 읽으면 원래 데이터');
      eq(Store.save(), true, '읽기가 정상이면 저장도 정상');
    });

    /* ---- 일정 ---- */
    function goodEvent(o) {
      var e = { id: 'e1', date: '2026-11-22', time: null, title: '일정', createdAt: 1000 };
      for (var k in o) e[k] = o[k];
      return e;
    }
    test('isDate: 실제 있는 날짜만', function () {
      eq(['2026-11-22', '2024-02-29', '2026-02-29', '2026-13-01', '2026-11-31', '2026-1-5', '', null, 20261122].map(Store.isDate),
        [true, true, false, false, false, false, false, false, false]);
    });
    test('addEvent: 공백 제거, 시각 선택, 필드 구성', function () {
      setNow(5000);
      var e = Store.addEvent('2026-11-22', '', '  회의  ');
      ok(e, 'addEvent가 null');
      eq([e.date, e.time, e.title, e.createdAt], ['2026-11-22', null, '회의', 5000]);
      ok(typeof e.id === 'string' && e.id.length > 0, 'id 없음');
      eq(Store.addEvent('2026-11-22', '14:30', '점심').time, '14:30');
      eq(Store.addEvent('2026-11-22', null, '종일').time, null);
      eq(Store.eventCount(), 3);
    });
    test('addEvent: 잘못된 값 거부', function () {
      eq(Store.addEvent('2026-11-22', '', '   '), null, '빈 내용');
      eq(Store.addEvent('2026-11-22', '', new Array(102).join('가')), null, '101자');
      eq(Store.addEvent('2026-02-30', '', '없는 날'), null, '없는 날짜');
      eq(Store.addEvent('2026-11-22', '25:00', '시각'), null, '잘못된 시각');
      eq(Store.eventCount(), 0);
    });
    test('eventsOn: 종일 먼저, 시각순, 같은 시각은 추가순', function () {
      setNow(1); Store.addEvent('2026-11-22', '15:00', 'c');
      setNow(2); Store.addEvent('2026-11-22', '09:00', 'a');
      setNow(3); Store.addEvent('2026-11-22', '', '종일');
      setNow(4); Store.addEvent('2026-11-22', '09:00', 'b');
      setNow(5); Store.addEvent('2026-11-23', '08:00', '다른 날');
      eq(Store.eventsOn('2026-11-22').map(function (e) { return e.title; }), ['종일', 'a', 'b', 'c']);
      eq(Store.eventsOn('2026-11-24'), []);
    });
    test('eventsInMonth: 그 달만 날짜별로 묶고 개수 계산', function () {
      Store.addEvent('2026-11-01', '', 'a');
      Store.addEvent('2026-11-30', '', 'b');
      Store.addEvent('2026-11-30', '10:00', 'c');
      Store.addEvent('2026-12-01', '', '다음 달');
      Store.addEvent('2026-10-31', '', '지난 달');
      var m = Store.eventsInMonth(2026, 11);
      eq(m.total, 3);
      eq(Object.keys(m.byDate).sort(), ['2026-11-01', '2026-11-30']);
      eq(m.byDate['2026-11-30'].map(function (e) { return e.title; }), ['b', 'c']);
      eq(Store.eventsInMonth(2027, 1).total, 0);
    });
    test('removeEvent·restoreEvent: 삭제 후 실행 취소, 중복 복원 거부', function () {
      var e = Store.addEvent('2026-11-22', '10:00', '치과');
      var removed = Store.removeEvent(e.id);
      eq(removed, e, '삭제한 일정 반환');
      eq(Store.eventCount(), 0);
      eq(Store.removeEvent(e.id), null, '없는 id');
      eq(Store.restoreEvent(removed), true);
      eq(Store.eventsOn('2026-11-22'), [e], '복원');
      eq(Store.restoreEvent(removed), false, '이미 있음');
    });
    test('일정은 저장되고 다시 load해도 유지, 완료 정리(purgeOld)와 무관', function () {
      var now = L(2026, 11, 22, 12);
      setNow(now);
      Store.addEvent('2025-01-01', '', '아주 옛날 일정');
      Store.configure({ key: TEST_KEY });
      setNow(now + 30 * DAY);
      Store.load();
      eq(Store.eventsOn('2025-01-01').length, 1);
      eq(JSON.parse(localStorage.getItem(TEST_KEY)).version, 1, 'version은 1 그대로');
    });
    test('load: events 없는 옛 데이터는 빈 일정으로, corrupt 아님', function () {
      seed({ version: 1, settings: {}, todos: [todo('a', { createdAt: 1 })] });
      eq(Store.eventCount(), 0);
      eq(localStorage.getItem(CORRUPT_KEY), null);
    });
    test('load: 잘못된 일정만 버리고 원본은 corrupt 키에 보관', function () {
      var raw = JSON.stringify({ version: 1, settings: {}, todos: [], events: [goodEvent({}), goodEvent({ id: 'x', date: '2026-02-30' })] });
      localStorage.setItem(TEST_KEY, raw);
      eq(Store.load(), false);
      eq(Store.eventCount(), 1);
      eq(localStorage.getItem(CORRUPT_KEY), raw);
    });
    test('validateBackup: events 검증', function () {
      eq(Store.validateBackup({ version: 1, todos: [], events: [goodEvent({}), goodEvent({ id: 'e2', time: '08:30' })] }).ok, true);
      bad({ version: 1, todos: [], events: {} }, 'events');
      bad({ version: 1, todos: [], events: [5] }, '1번째 일정');
      bad({ version: 1, todos: [], events: [goodEvent({}), goodEvent({})] }, '2번째 일정의 id가 중복');
      bad({ version: 1, todos: [], events: [goodEvent({ date: '2026-11-31' })] }, 'date');
      bad({ version: 1, todos: [], events: [goodEvent({ time: '8:30' })] }, 'time');
      bad({ version: 1, todos: [], events: [goodEvent({ time: undefined })] }, 'time');
      bad({ version: 1, todos: [], events: [goodEvent({ title: '  ' })] }, 'title');
      bad({ version: 1, todos: [], events: [goodEvent({ createdAt: '1' })] }, 'createdAt');
    });
    test('importBackup: events 있으면 교체, 없는 옛 백업은 현재 일정 유지', function () {
      Store.addEvent('2026-11-22', '', '현재 일정');
      var r = Store.importBackup({ version: 1, todos: [] });
      eq([r.ok, r.events], [true, 1], 'events 없음 → 유지');
      eq(Store.eventsOn('2026-11-22')[0].title, '현재 일정');
      r = Store.importBackup({ version: 1, todos: [], events: [goodEvent({ id: 'n', date: '2026-12-25', title: '성탄절' })] });
      eq([r.ok, r.events], [true, 1]);
      eq(Store.eventsOn('2026-11-22'), [], '교체됨');
      eq(Store.eventsOn('2026-12-25')[0].title, '성탄절');
      eq(JSON.parse(Store.exportData()).events.length, 1, '내보내기에 포함');
    });

    /* ---- 격리 ---- */
    test('실제 키(todo-app-v1)를 건드리지 않음', function () {
      Store.add('a', 'work');
      eq(localStorage.getItem(REAL_KEY), realBefore);
      eq(localStorage.getItem(REAL_KEY + '-before-import'), realBeforeImport, '실제 before-import 키');
    });

    // 정리 후 결과 표시
    localStorage.removeItem(TEST_KEY);
    localStorage.removeItem(CORRUPT_KEY);
    localStorage.removeItem(BEFORE_KEY);
    Store.configure({ key: REAL_KEY, clock: null });

    var list = document.getElementById('results');
    var failed = 0;
    results.forEach(function (r) {
      var li = document.createElement('li');
      var mark = document.createElement('span');
      mark.className = r.ok ? 'pass-mark' : 'fail-mark';
      mark.textContent = r.ok ? '통과 ' : '실패 ';
      li.appendChild(mark);
      li.appendChild(document.createTextNode(r.name));
      if (!r.ok) {
        failed++;
        var m = document.createElement('div');
        m.className = 'msg';
        m.textContent = r.msg;
        li.appendChild(m);
      }
      list.appendChild(li);
    });
    var summary = document.getElementById('summary');
    summary.textContent = failed
      ? failed + '개 실패 (전체 ' + results.length + '개)'
      : '전체 ' + results.length + '개 통과';
    summary.className = failed ? 'fail' : 'pass';
    document.title = (failed ? '실패 ' : '통과 ') + '- Store 테스트';
  </script>
</body>
</html>
